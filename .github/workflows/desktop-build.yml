name: Desktop Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            bundles: nsis,msi
          - platform: Linux
            runner: ubuntu-24.04
            bundles: deb

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: anyps5-builder-app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: anyps5-builder-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: anyps5-builder-app/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop packages
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Upload desktop packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anyps5-builder-${{ matrix.platform }}-${{ github.sha }}
          path: anyps5-builder-app/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14
