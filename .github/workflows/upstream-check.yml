name: Check official AnyPS5 updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Builder
        uses: actions/checkout@v4
      - name: Check release and source commit
        run: python3 updater/check_upstream.py
